<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{.Meta.Title}} - {{.Site.Title}}</title>
    <meta name="description" content="{{.Meta.Description}}" />
    <meta property="og:title" content="{{.Meta.Title}}" />
    <meta property="og:description" content="{{.Meta.Description}}" />
    <meta property="og:type" content="article" />
    {{if .Site.BaseURL}}
    <meta property="og:url" content="{{.Site.BaseURL}}/{{.Meta.Date.Format "2006/01/02"}}/{{.Meta.Slug}}/index.html" />
    {{end}}
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=Overpass+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{.CSSHref}}" />
    <link rel="stylesheet" href="https://cdn.datatables.net/2.2.2/css/dataTables.dataTables.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
</head>

<body>

    <main class="post">
        <article>
            <header class="post-header">
                <h1>{{.Meta.Title}}</h1>
                <p class="post-desc">{{.Meta.Description}}</p>
                {{if .Meta.Tags}}
                <div class="post-tags">
                    <i class="fa-solid fa-tags"></i>
                    {{range .Meta.Tags}}<span class="tag">{{.}}</span>{{end}}
                </div>
                {{end}}
                <time datetime="{{.Meta.Date.Format "2006-01-02"}}"><i class="fa-regular fa-calendar"></i> {{.Meta.Date.Format "January 2, 2006"}}</time>
            </header>
            {{if .TOC}}
            <div class="post-layout {{if .TOCTop}}toc-top{{else}}toc-side{{end}}">
                <aside class="toc-sidebar">
                    {{.TOC}}
                </aside>
                <div class="post-body">
                    {{.Body}}
                </div>
            </div>
            {{else}}
            <div class="post-body">
                {{.Body}}
            </div>
            {{end}}
        </article>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/2.2.2/js/dataTables.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.post-body table').forEach(function (table) {
                new DataTable(table, {
                    paging: true,
                    searching: true,
                    ordering: true,
                    pageLength: 10
                });
            });
        });
    </script>
    {{- if .HasTweets}}
    <script>
        // Embedded X posts: match the reader's light/dark preference, then let
        // widgets.js replace each blockquote.twitter-tweet with the live post.
        (function () {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.querySelectorAll('blockquote.twitter-tweet').forEach(function (b) { b.setAttribute('data-theme', 'dark'); });
            }
            var s = document.createElement('script');
            s.src = 'https://platform.twitter.com/widgets.js';
            s.async = true;
            s.charset = 'utf-8';
            document.body.appendChild(s);
        })();
    </script>
    {{- end}}
    <div id="image-lightbox" aria-hidden="true">
        <button id="image-lightbox-close" aria-label="Close image"><i class="fa-solid fa-xmark"></i></button>
        <img alt="" />
    </div>
    <script>
        (function () {
            var box = document.getElementById('image-lightbox');
            var full = box.querySelector('img');
            var closeBtn = document.getElementById('image-lightbox-close');
            function open(src, alt) {
                full.src = src;
                full.alt = alt || '';
                box.classList.add('open');
                box.setAttribute('aria-hidden', 'false');
                document.body.style.overflow = 'hidden';
            }
            function close() {
                box.classList.remove('open');
                box.setAttribute('aria-hidden', 'true');
                document.body.style.overflow = '';
            }
            document.querySelectorAll('.post-body img').forEach(function (img) {
                img.addEventListener('click', function () { open(img.currentSrc || img.src, img.alt); });
            });
            box.addEventListener('click', function (e) { if (e.target !== full) close(); });
            closeBtn.addEventListener('click', close);
            document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && box.classList.contains('open')) close(); });
        })();
    </script>
</body>

</html>
